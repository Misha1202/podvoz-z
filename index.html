<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление подвозом</title>
  <style>
    :root {
      --bg-main: #0f0c1b;
      --bg-card: #18142c;
      --primary: #8a2be2;
      --primary-hover: #9d4edd;
      --accent-orange: #ff5400;
      --accent-blue: #70d6ff;
      --accent-red: #ff4757;
      --accent-red-hover: #ff6b81;
      --text-main: #f3f0ff;
      --text-muted: #a39fbc;
      --border: #2e2754;
    }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      margin: 0; padding: 15px;
      background-color: var(--bg-main); color: var(--text-main);
      display: flex; justify-content: center; align-items: center; min-height: 95vh;
    }
    .container {
      width: 100%; max-width: 460px;
      background: var(--bg-card); padding: 30px;
      border-radius: 16px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 1px 1px var(--border);
      box-sizing: border-box; position: relative;
    }
    .header-area {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
    }
    h2 { margin: 0; font-size: 24px; font-weight: 600; }
    .btn-refresh {
      background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main);
      border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s ease;
    }
    .btn-refresh:hover { border-color: var(--primary); background: #1c1536; }
    .btn-refresh svg { width: 16px; height: 16px; fill: currentColor; transition: transform 0.4s ease; }
    .btn-refresh.loading svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .square-display {
      font-size: 72px; font-weight: 800; text-align: center; margin-top: 30px; margin-bottom: 5px;
      background: linear-gradient(45deg, #b5179e, #7209b7); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .badge-display {
      text-align: center; font-size: 18px; color: var(--text-muted); margin-bottom: 35px; font-weight: 500;
    }
    .badge-display span { color: var(--accent-blue); font-weight: 700; }
    .actions-block {
      display: flex; flex-direction: column; gap: 12px;
    }
    .btn-done {
      width: 100%; padding: 18px; background: var(--primary); color: var(--text-main);
      border: none; border-radius: 10px; font-size: 18px; cursor: pointer; font-weight: 700;
      transition: background 0.2s;
    }
    .btn-done:hover { background: var(--primary-hover); }
    .btn-exit {
      width: 100%; padding: 14px; background: transparent; color: var(--accent-red);
      border: 1px solid var(--border); border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 600;
      transition: all 0.2s;
    }
    .btn-exit:hover { background: rgba(255, 71, 87, 0.1); border-color: var(--accent-red); }
    .no-orders { text-align: center; font-size: 18px; color: var(--text-muted); padding: 50px 0; }
    .modal {
      display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%;
      background: rgba(7, 5, 14, 0.8); backdrop-filter: blur(4px); justify-content: center; align-items: center;
    }
    .modal-content {
      background: var(--bg-card); padding: 30px; border-radius: 16px; text-align: center;
      max-width: 360px; width: 100%; border: 1px solid var(--border);
    }
    .modal-btns { display: flex; gap: 15px; margin-top: 25px; }
    .btn-modal { flex: 1; padding: 18px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; }
    .btn-kgt { background: var(--accent-orange); color: white; }
    .btn-std { background: var(--accent-blue); color: #05040a; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-area">
    <h2 id="screen-title">Текущее задание</h2>
    <button class="btn-refresh" id="btnRefresh" onclick="loadNextOrder()">
      <svg viewBox="0 0 24 24">
        <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
      Обновить
    </button>
  </div>

  <div id="order-box">
    <div class="square-display" id="current-square">...</div>
    <div class="badge-display">Бейдж заказа: <span id="current-badge">...</span></div>
    
    <div class="actions-block">
      <button class="btn-done" onclick="showModal()">Готово</button>
      <button class="btn-exit" id="btnExit" onclick="handleWorkExit()">Завершить работу</button>
    </div>
  </div>

  <div id="empty-box" class="no-orders" style="display:none;">
    ✨ Все задания выполнены!
    <button class="btn-exit" style="margin-top:25px;" onclick="setWorkFinishedMode()">Завершить работу</button>
  </div>

  <div id="finished-box" class="no-orders" style="display:none;">
    🛑 Работа успешно завершена.<br>Смена закрыта.
    <button class="btn-done" style="margin-top:25px; font-size:15px; padding:12px;" onclick="restartWork()">Начать работу заново</button>
  </div>
</div>

<div id="typeModal" class="modal">
  <div class="modal-content">
    <h3>Выберите тип груза</h3>
    <div class="modal-btns">
      <button class="btn-modal btn-kgt" onclick="selectType('КГТ')">КГТ</button>
      <button class="btn-modal btn-std" onclick="selectType('Стандарт')">Стандарт</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "ВАШ_URL_ИЗ_GOOGLE_APPS_SCRIPT"; 

  let currentOrderRow = null;
  let isExitingWork = false;

  window.onload = function() {
    loadNextOrder();
  };

  window.addEventListener('beforeunload', function (e) {
    if (currentOrderRow) {
      e.preventDefault();
      e.returnValue = 'У вас есть активное задание!';
    }
  });

  function jsonp(url, callbackName, successCallback) {
    const uniqueCallback = callbackName + '_' + Math.round(Math.random() * 1000000);
    window[uniqueCallback] = function(data) {
      successCallback(data);
      document.getElementById(uniqueCallback).remove();
      delete window[uniqueCallback];
    };
    let script = document.createElement('script');
    script.id = uniqueCallback;
    script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + uniqueCallback;
    document.body.appendChild(script);
  }

  function loadNextOrder() {
    if (document.getElementById('finished-box').style.display === 'block') return;

    const refreshBtn = document.getElementById('btnRefresh');
    const squareDiv = document.getElementById('current-square');
    const badgeSpan = document.getElementById('current-badge');
    
    refreshBtn.classList.add('loading');
    refreshBtn.disabled = true;

    var sendRow = currentOrderRow ? currentOrderRow : "";
    if (squareDiv.innerText !== '...') squareDiv.innerText = '...';
    if (badgeSpan.innerText !== '...') badgeSpan.innerText = '...';

    jsonp(`${API_URL}?action=getOldest&currentFormRow=${sendRow}`, 'cb_oldest', function(response) {
      refreshBtn.classList.remove('loading');
      refreshBtn.disabled = false;

      if(response.success && response.data) {
        currentOrderRow = response.data.row;
        squareDiv.innerText = response.data.square;
        badgeSpan.innerText = response.data.badge || 'Не указан';
        document.getElementById('order-box').style.display = 'block';
        document.getElementById('empty-box').style.display = 'none';
        document.getElementById('finished-box').style.display = 'none';
      } else {
        currentOrderRow = null;
        document.getElementById('order-box').style.display = 'none';
        document.getElementById('empty-box').style.display = 'block';
        document.getElementById('finished-box').style.display = 'none';
      }
    });
  }

  function handleWorkExit() {
    if (currentOrderRow) {
      isExitingWork = true;
      showModal();
    } else {
      setWorkFinishedMode();
    }
  }

  function showModal() { 
    if(currentOrderRow) document.getElementById('typeModal').style.display = 'flex'; 
  }

  document.getElementById('typeModal').addEventListener('click', function(e) {
    if(e.target === this) {
      this.style.display = 'none';
      isExitingWork = false;
    }
  });

  function selectType(type) {
    document.getElementById('typeModal').style.display = 'none';
    if(!currentOrderRow) return;
    
    document.getElementById('current-square').innerText = '...';
    document.getElementById('current-badge').innerText = '...';

    let formBody = new URLSearchParams();
    formBody.append('action', 'completeOrder');
    formBody.append('row', currentOrderRow);
    formBody.append('type', type);

    currentOrderRow = null;

    fetch(API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: formBody
    }).then(() => {
      if (isExitingWork) {
        setWorkFinishedMode();
      } else {
        setTimeout(loadNextOrder, 400); 
      }
    }).catch(err => {
      alert('Ошибка сети при обновлении статуса');
    });
  }

  function setWorkFinishedMode() {
    currentOrderRow = null;
    isExitingWork = false;
    document.getElementById('order-box').style.display = 'none';
    document.getElementById('empty-box').style.display = 'none';
    document.getElementById('btnRefresh').style.display = 'none';
    document.getElementById('screen-title').style.display = 'none';
    document.getElementById('finished-box').style.display = 'block';
  }

  function restartWork() {
    document.getElementById('finished-box').style.display = 'none';
    document.getElementById('btnRefresh').style.display = 'flex';
    document.getElementById('screen-title').style.display = 'block';
    loadNextOrder();
  }
</script>
</body>
</html>
